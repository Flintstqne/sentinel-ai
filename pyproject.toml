[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ai"
version = "0.1.0"
description = "Linux-native, AI-assisted security companion for Linux Mint Cinnamon"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
sentinel-ai = "sentinel_ai.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinel_ai = ["assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "E501"]
